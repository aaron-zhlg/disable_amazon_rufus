<!DOCTYPE html>
<html>
<head>
  <title>Disable Amazon Rufus</title>
  <link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>
  <div class="container">
    <h3>Disable Amazon Rufus</h3>
    <div class="setting">
      <label for="toggle" class="switch-label">Block Rufus Panel</label>
      <label class="switch">
        <input type="checkbox" id="toggle" checked>
        <span class="slider round"></span>
      </label>
    </div>
    <p class="status" id="status-text">Rufus is hidden</p>
    <script src="popup.js"></script>
  </div>
</body>
</html>
